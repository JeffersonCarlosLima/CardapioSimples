<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Digital</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/responsivo.css">
</head>
<body>

    <header class="header sticky-top">
        <div class="container">
            <div class="header-content">
                <img src="./img/logo.svg" alt="logo" class="header-logo">
                <h1 class="header-title">Zap Menu</h1>
                </div>
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Pesquise aqui...">
            </div>
        </div>
    </header>

    <main class="container" id="cardapio">
        <div class="row">

            <div class="col-12">
                <div class="container-menu">
                    </div>
            </div>

            <div class="col-12">
                <div class="cardapio-container" id="itensCardapio">
                    </div>
            </div>

        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="row">
                <div class="col-6 col-lg-3 col-md-3 container-logo-footer">
                    <img src="./img/logo.svg" alt="logomarca" class="logo-footer">
                </div>
                <div class="col-6 col-lg-6 col-md-6 container-text-footer">
                    <p class="mb-0">
                        <b>Menu Online</b>&copy; Todos os direitos reservados.
                    </p>
                </div>
                <div class="col-12 col-lg-3 col-md-3 container-redes-footer">
                   <div class="social-icons">
                        <a href="#" class="btn-social" title="Siga-nos no Instagram">
                            <i class="fab fa-instagram" aria-hidden="true"></i>
                            <span class="visually-hidden">Instagram</span>
                        </a> 
                        <a href="#" class="btn-social" title="Curta nossa página no Facebook">
                            <i class="fab fa-facebook-f" aria-hidden="true"></i>
                            <span class="visually-hidden">Facebook</span>
                        </a>
                        <a href="#" class="btn-social" title="Entre em contato pelo WhatsApp">
                            <i class="fab fa-whatsapp" aria-hidden="true"></i>
                            <span class="visually-hidden">WhatsApp</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script type="text/javascript" src="./js/app.js"></script> 
    <script type="text/javascript" src="./js/dados.js" defer></script>
</body>
</html>
